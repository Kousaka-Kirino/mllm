# S5 干预臂 B：反事实增广 —— 同图换问法（金标不变）+ 同问换数值（金标改变）
base: model.yaml
method: counterfactual
train:
  lr: 2.0e-4
  batch_size: 2
  grad_accum: 8
  epochs: 1
  max_steps: 800
data:
  split: train
  augment:
    question_order: true      # 同图、改选项顺序、金标不变 → 训练"不变性"
    value_swap: true          # 同问、换图表数值、金标按规则变 → 训练"响应性"
    ratio: 0.5                # 增广样本占比
init_connector: outputs/ckpt/align/connector.pt
output: outputs/ckpt/counterfactual
