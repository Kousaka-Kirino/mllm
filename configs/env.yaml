# S0 环境与底座：这一份是"设备事实"，不是愿望
# 任何一项不达标，后面的阶段门槛都不该继续往上加码。

python: "3.11"

gpu:
  name_contains: "RTX 4060"
  min_total_mib: 7000          # 低于这个数说明显卡没被识别对
  min_free_mib_for_train: 5000 # 低于这个数不要开训练（桌面程序会抢显存）
  require_cuda: true

packages:                       # 必须有，缺一个就算 L0 不成立
  - torch
  - transformers
  - peft
  - accelerate
  - numpy
  - pillow
  - matplotlib
  - pytest
  - yaml

optional_packages:              # 没有也能跑，但要记录（影响 GRPO/数据加载）
  - datasets
  - trl
  - bitsandbytes

disk:
  min_free_gb: 12               # 权重 + 数据 + checkpoint 的余量

mirrors:                        # 下载兜底：按顺序探测
  - https://huggingface.co
  - https://hf-mirror.com
  - https://www.modelscope.cn
